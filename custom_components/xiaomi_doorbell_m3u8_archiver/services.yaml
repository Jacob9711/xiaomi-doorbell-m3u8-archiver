enqueue:
  name: Enqueue
  description: Enqueue a manual video job from an entity.
  fields:
    entity_id:
      name: Entity
      description: Camera or Xiaomi doorbell entity ID.
      required: true
      example: camera.loock_xxxxx_video_doorbell
      selector:
        entity: {}
    event_time:
      name: Event Time
      description: Optional event time override.
      example: "2026-02-27T10:12:31"
      selector:
        text: {}

get_status:
  name: Get Status
  description: Return runtime status; without target and multiple entries, returns all instances.
  fields:
    entry_id:
      name: Config Entry ID
      description: Optional config entry id target.
      selector:
        text: {}
    entity_id:
      name: Entity
      description: Optional camera entity id target.
      selector:
        entity: {}
